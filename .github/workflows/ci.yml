name: CI

on:
  push:
    branches: [main, refactor/repository-intelligence]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Safety lint
        run: npm run lint

      - name: Evaluate repository intelligence
        run: npm run evaluate:repository

      - name: Verify local built artifact
        run: npm run verify:built-artifact

      - name: Validate OpenSpec specs and active changes
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive

      - name: Check patch formatting
        run: git diff --check
